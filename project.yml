name: DriveDash

options:
  bundleIdPrefix: com.drivedash

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    SWIFT_VERSION: 5.0

targets:
  DriveDash:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - ContentView.swift
      - DriveDashApp.swift
      - NavigationProvider.swift
      - PiPManager.swift
      - PiPPlayerHost.swift

    resources:
      - pip-dashboard.mp4

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drivedash.prototype
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_STYLE: Automatic
