name: Build DriveDash iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build simulator version
        run: |
          set -o pipefail

          xcodebuild \
            -project DriveDash.xcodeproj \
            -scheme DriveDash \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/simulator \
            build

      - name: Build unsigned iPhone version
        run: |
          set -o pipefail

          xcodebuild \
            -project DriveDash.xcodeproj \
            -scheme DriveDash \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build/device \
            build

      - name: Create unsigned IPA
        run: |
          APP_PATH=$(find build/device/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -name '*.app' \
            -print \
            -quit)

          test -n "$APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          zip -qry DriveDash-unsigned.ipa Payload

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: DriveDash-simulator
          path: build/simulator/Build/Products/Debug-iphonesimulator/DriveDash.app

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DriveDash-unsigned-ipa
          path: DriveDash-unsigned.ipa
